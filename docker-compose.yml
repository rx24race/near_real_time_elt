services:
  postgres:
    image: postgres:16
    container_name: cdc_postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-ecommerce}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./scripts:/opt/project/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ecommerce}"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.1
    container_name: cdc_kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-connect:
    image: debezium/connect:2.7.3.Final
    container_name: cdc_kafka_connect
    ports:
      - "${KAFKA_CONNECT_PORT:-8083}:8083"
    environment:
      BOOTSTRAP_SERVERS: "kafka:9092"
      GROUP_ID: "cdc-connect-cluster"
      CONFIG_STORAGE_TOPIC: "connect_configs"
      OFFSET_STORAGE_TOPIC: "connect_offsets"
      STATUS_STORAGE_TOPIC: "connect_statuses"
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: cdc_kafka_ui
    ports:
      - "${KAFKA_UI_PORT:-8081}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: "local-connect"
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: "http://kafka-connect:8083"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-connect:
        condition: service_started

  python-bq-consumer:
    build:
      context: ./consumer
    container_name: cdc_python_bq_consumer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_CONSUMER_GROUP: "${KAFKA_CONSUMER_GROUP:-cdc-bq-bronze-loader}"
      KAFKA_TOPICS: "${KAFKA_TOPICS:-postgres.customers,postgres.products,postgres.orders,postgres.order_items,postgres.payments}"
      KAFKA_AUTO_OFFSET_RESET: "${KAFKA_AUTO_OFFSET_RESET:-earliest}"
      KAFKA_MAX_POLL_RECORDS: "${KAFKA_MAX_POLL_RECORDS:-100}"
      KAFKA_POLL_TIMEOUT_MS: "${KAFKA_POLL_TIMEOUT_MS:-5000}"
      GCP_PROJECT_ID: "${GCP_PROJECT_ID:-your-gcp-project-id}"
      BIGQUERY_BRONZE_DATASET: "${BIGQUERY_BRONZE_DATASET:-bronze}"
      BIGQUERY_BRONZE_TABLE: "${BIGQUERY_BRONZE_TABLE:-cdc_events}"
      BIGQUERY_LOCATION: "${BIGQUERY_LOCATION:-US}"
      BIGQUERY_MAX_RETRIES: "${BIGQUERY_MAX_RETRIES:-3}"
      BIGQUERY_RETRY_BACKOFF_SECONDS: "${BIGQUERY_RETRY_BACKOFF_SECONDS:-5}"
      GOOGLE_APPLICATION_CREDENTIALS: "${GOOGLE_APPLICATION_CREDENTIALS:-/opt/app/credentials/service_account.json}"
    volumes:
      - ./consumer:/opt/app
      - ./bigquery:/opt/app/credentials:ro
    depends_on:
      kafka:
        condition: service_healthy

  airflow:
    build:
      context: ./airflow
    container_name: cdc_airflow
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: "SequentialExecutor"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "sqlite:////opt/airflow/airflow.db"
      AIRFLOW__SMTP__SMTP_HOST: "${AIRFLOW_SMTP_HOST:-localhost}"
      AIRFLOW__SMTP__SMTP_PORT: "${AIRFLOW_SMTP_PORT:-25}"
      AIRFLOW__SMTP__SMTP_USER: "${AIRFLOW_SMTP_USER:-}"
      AIRFLOW__SMTP__SMTP_PASSWORD: "${AIRFLOW_SMTP_PASSWORD:-}"
      AIRFLOW__SMTP__SMTP_MAIL_FROM: "${AIRFLOW_SMTP_MAIL_FROM:-airflow@example.com}"
      AIRFLOW__SMTP__SMTP_STARTTLS: "${AIRFLOW_SMTP_STARTTLS:-False}"
      AIRFLOW__SMTP__SMTP_SSL: "${AIRFLOW_SMTP_SSL:-False}"
      AIRFLOW_ALERT_EMAIL_TO: "${AIRFLOW_ALERT_EMAIL_TO:-}"
      GCP_PROJECT_ID: "${GCP_PROJECT_ID:-your-gcp-project-id}"
      BIGQUERY_BRONZE_DATASET: "${BIGQUERY_BRONZE_DATASET:-bronze}"
      BIGQUERY_BRONZE_TABLE: "${BIGQUERY_BRONZE_TABLE:-cdc_events}"
      BIGQUERY_LOCATION: "${BIGQUERY_LOCATION:-US}"
      GOOGLE_APPLICATION_CREDENTIALS: "/opt/project/bigquery/service_account.json"
      DATAFORM_PROJECT_DIR: "/opt/project/dataform"
      _AIRFLOW_WWW_USER_USERNAME: "${AIRFLOW_USERNAME:-admin}"
      _AIRFLOW_WWW_USER_PASSWORD: "${AIRFLOW_PASSWORD:-admin}"
    user: "${AIRFLOW_UID:-50000}:0"
    command:
      - "bash"
      - "-c"
      - |
        set -e
        airflow db migrate
        airflow users create \
          --username "$${_AIRFLOW_WWW_USER_USERNAME}" \
          --password "$${_AIRFLOW_WWW_USER_PASSWORD}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
        || airflow users reset-password \
          --username "$${_AIRFLOW_WWW_USER_USERNAME}" \
          --password "$${_AIRFLOW_WWW_USER_PASSWORD}"
        airflow scheduler &
        exec airflow webserver
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./dataform:/opt/project/dataform
      - ./bigquery:/opt/project/bigquery:ro

volumes:
  postgres_data:
  kafka_data:
